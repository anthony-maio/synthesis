[project]
name = "synthesis-ai"
version = "0.3.0"
description = "Skill-first self-extension for coding agents with search, composition, and GitHub-based curation"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Anthony Maio"},
    {name = "Codex"},
]
requires-python = ">=3.10"
keywords = ["ai", "mcp", "skills", "synthesis", "agents", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0",
    "httpx>=0.25",
]

[project.optional-dependencies]
# LLM providers
claude = ["anthropic>=0.18"]
all-providers = ["anthropic>=0.18"]

# MCP server
mcp = ["mcp>=1.0"]

# Exchange server
exchange = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

# Docker sandbox (production)
docker = ["docker>=7.0"]

# Development
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.8",
]

# All optional dependencies
all = [
    "anthropic>=0.18",
    "mcp>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "docker>=7.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
synthesis = "synthesis.cli:main"
synthesis-exchange = "exchange_server.main:main"

[project.urls]
Homepage = "https://synthesis.making-minds.ai"
Documentation = "https://github.com/anthony-maio/synthesis#readme"
Repository = "https://github.com/anthony-maio/synthesis"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["synthesis", "exchange_server"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/LICENSE",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
    "/SECURITY.md",
    "/pyproject.toml",
    "/synthesis",
    "/exchange_server",
    "/tests",
    "/website",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]  # Line length handled separately

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
